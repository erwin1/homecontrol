<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>homecontrol - metrics details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="details.css">
</head>
<body>
    <div class="header">
        <nav class="nav-menu">
            <a href="index.html">Dashboard</a>
            <a href="details.html" class="active">Stats</a>
            <a href="/config">Config</a>
        </nav>
    </div>

    <div class="container">
        <div class="filters">
            <div class="filter">
                <label for="datepicker">Date:</label>
                <input type="text" id="datepicker">
            </div>
            <div class="filter">
                <label for="month">Month:</label>
                <select id="month" name="month"></select>
            </div>
            <div class="filter">
                <label for="month1">Range:</label>
                <select id="month1" name="month1"></select>
                <span>-</span>
                <select id="month2" name="month2"></select>
            </div>
        </div>

        <div class="main-content">
            <div class="chart-container">
                <canvas id="barChart"></canvas>
            </div>
            
            <div class="sidebar">
                <div class="box">
                    <canvas id="totalRatioChart"></canvas>
                    <div class="ratioLegend">
                        <div class="legendrow">
                            <div class="legend pv"></div>
                            <span class="legendlabel">PV <span id="totalpv"></span></span>
                        </div>
                        <div class="legendrow">
                            <div class="legend gridin"></div>
                            <span class="legendlabel">Grid IN <span id="totalgridin"></span></span>
                        </div>
                        <div class="legendrow">
                            <div class="legend ev"></div>
                            <span class="legendlabel">EV Charging <span id="totalev"></span></span>
                        </div>
                        <div class="legendrow">
                            <div class="legend home"></div>
                            <span class="legendlabel">Home usage <span id="totalhome"></span></span>
                        </div>
                        <div class="legendrow">
                            <div class="legend gridout"></div>
                            <span class="legendlabel">Grid OUT <span id="totalgridout"></span></span>
                        </div>
                        <div id="evdetail"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>



<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.0.2/jquery.min.js'></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.3.0/chart.umd.js" integrity="sha512-CMF3tQtjOoOJoOKlsS7/2loJlkyctwzSoDK/S40iAB+MqWSaf50uObGQSk5Ny/gfRhRCjNLvoxuCvdnERU4WGg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="raphael.min.js"></script>
<script src="justgage.js"></script>
<script src="detailscript.js"></script>


</body>
</html>
